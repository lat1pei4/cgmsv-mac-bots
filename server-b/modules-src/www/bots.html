<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色管理</title>
<style>
  /* 仿遊戲視窗：羊皮紙底、木框（遊戲只有這一種配色，不分深淺色） */
  :root {
    --bg: #5b4630; --panel: #f3e7c9; --cell: #e9d9b2; --text: #3b2a17; --muted: #7a6446; --line: #a8865a; --frame: #6e4f2c;
    --accent: #8a4f1d; --ok: #3e7d3a; --warn: #b7791f; --bad: #b03a2e; --hp: #d0453b; --mp: #3c6fc4; --exp: #c9a227;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg) radial-gradient(circle at 50% 0, #7a5f40, var(--bg) 70%) fixed; color: var(--text); font: 14px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #f3e7c9; text-shadow: 0 1px 0 #000; }
  .sub { color: #d9c7a0; margin: 0 0 16px; }
  section { background: var(--panel); border: 3px double var(--frame); border-radius: 6px; padding: 14px 16px; margin-bottom: 16px;
    box-shadow: inset 0 0 0 1px #fff8e4, 0 3px 8px rgba(0, 0, 0, .4); }
  h2 { color: var(--accent); }
  img.px { image-rendering: pixelated; }
  .face { width: 32px; height: 36px; vertical-align: middle; margin-right: 6px; border: 1px solid var(--line); background: var(--cell); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--accent); }
  th.sort.asc::after { content: ' ▲'; } th.sort.desc::after { content: ' ▼'; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  input, select { font: inherit; color: var(--text); background: var(--cell); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  input { width: 130px; }
  button { font: inherit; font-size: 13px; color: var(--text); background: linear-gradient(#f6ecd2, #dcc699); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .state { font-weight: 600; white-space: nowrap; }
  .state.online { color: var(--ok); } .state.failed, .state.closed { color: var(--bad); } .state.connect, .state.login, .state.list, .state.enter { color: var(--warn); }
  .err { color: var(--bad); font-size: 12px; }
  .bar { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar > div { height: 100%; }
  .num { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .tags span { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); margin: 0 4px 2px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
  #toast { position: fixed; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: none; }
  .muted { color: var(--muted); }
  .who { cursor: pointer; color: var(--accent); }
  .who:hover { text-decoration: underline; }
  dialog { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 4px double var(--frame); border-radius: 8px; padding: 0; background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--panel); }
  .dhead h2 { margin: 0; }
  .dbody { padding: 12px 16px 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 640px) { .dbody { grid-template-columns: minmax(0, 1fr); } }
  .card { border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; background: #f8efd6; min-width: 0; }
  .card h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); }
  .card.wide { grid-column: 1 / -1; }
  .kv { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 13px; max-width: 340px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .slots { display: grid; gap: 4px; font-size: 12px; }
  .slots.equip { grid-template-columns: repeat(2, 1fr); }
  .slots.bag { grid-template-columns: repeat(5, 1fr); }
  .slot { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-height: 40px; background: var(--cell); display: flex; gap: 6px; align-items: center; }
  .slot img { flex: none; max-width: 40px; max-height: 44px; }
  .slots.bag .slot { justify-content: center; min-height: 52px; padding: 2px; position: relative; }
  .slots.bag .slot .cnt { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 600; }
  .portrait { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 8px; }
  .portrait .body { max-height: 110px; }
  .petlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .petlist li { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--cell); cursor: pointer; }
  .petlist li:hover { border-color: var(--accent); }
  .petlist li.sel { border: 2px solid var(--accent); background: #fff6dc; }
  .petlist .thumb { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .petinfo { border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; background: #f8efd6; min-width: 0; }
  .barsrow { display: grid; grid-template-columns: 1fr 1fr; max-width: 340px; align-items: end; }
  .petinfo .petpic { height: 96px; display: flex; align-items: flex-end; }
  .petinfo .petpic img { max-width: 96px; max-height: 96px; }
  .slot .lbl { color: var(--muted); font-size: 11px; }
  .slot.empty { color: var(--muted); }
  .pets { display: grid; gap: 10px; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 640px) { .pets { grid-template-columns: minmax(0, 1fr); } }
  .elem span { display: inline-block; min-width: 44px; font-size: 12px; }
  .plus { font-size: 11px; padding: 0 5px; margin-left: 4px; line-height: 16px; }
  .slot { min-width: 0; } .slot > div { min-width: 0; }
  .slot .mini { font-size: 11px; padding: 0 5px; margin-left: auto; white-space: nowrap; flex: none; }
  .slots.bag .slot.has { cursor: pointer; } .slots.bag .slot.has:hover { border-color: var(--accent); }
  .slots.bag .slot.sel { border: 2px solid var(--accent); background: #fff6dc; }
  .bagbar { margin: 8px 0 0; min-height: 28px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>角色管理</h1>
  <p class="sub">伺服器扮演遊戲端讓這些帳號上線；角色是一般玩家身分，存檔與自動戰鬥照常。每 2 秒更新。</p>

  <section>
    <h2>新增帳號</h2>
    <form id="add">
      <label>帳號<input name="account" required pattern="[A-Za-z0-9_]{1,16}" autocomplete="off"></label>
      <label>密碼<input name="password" required pattern="[A-Za-z0-9_]{1,16}" autocomplete="off"></label>
      <label>角色位置<select name="slot"><option value="0">左（0）</option><option value="1">右（1）</option></select></label>
      <label>角色名（英數字；該位置沒角色時自動建立，中文名請在遊戲裡建）<input name="charname" pattern="[A-Za-z0-9_]{1,16}" autocomplete="off"></label>
      <button class="primary" type="submit">新增</button>
    </form>
  </section>

  <section>
    <h2>帳號 <span class="muted" id="count"></span></h2>
    <div class="filters">
      <label>搜尋（帳號／角色名）<input id="q" autocomplete="off"></label>
      <label>狀態<select id="fstate"><option value="">全部</option><option value="online">在線</option><option value="offline">不在線</option></select></label>
      <label>狀況<select id="fact"><option value="">全部</option><option value="grind">練等中</option><option value="battle">戰鬥中</option><option value="party">組隊中</option><option value="solo">單人</option></select></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="sort" data-sort="account">帳號</th><th class="sort" data-sort="state">狀態</th><th class="sort" data-sort="lv">角色</th><th class="sort" data-sort="hp">血／魔</th><th class="sort" data-sort="map">位置</th><th>狀況</th><th>指令</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="muted">載入中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<dialog id="detail">
  <div class="dhead"><h2 id="dtitle"></h2><button id="dclose">關閉</button></div>
  <div class="dbody" id="dbody"></div>
</dialog>
<div id="toast"></div>

<script>
const STATE = { offline: '離線', connect: '連線中', login: '登入中', list: '讀取角色', enter: '進入遊戲', online: '在線', failed: '失敗', closed: '已斷線' };
// 伺服器回英數代碼，這裡翻成中文；「代碼:參數」的參數接在後面
const MSG = {
  bad_param: '參數不對', offline: '角色不在線上', login: '登入中', logout: '已登出', saved: '已設定',
  auto_on: '自動戰鬥開', auto_off: '自動戰鬥關', hospital: '回東醫補滿（隊員不能單獨回，要由隊長）',
  encount: '原地遇敵（失敗＝這裡不會遇敵或已在戰鬥）', grind_on: '開始原地練等', grind_off: '停止練等',
  bad_pos: '座標不能站', warped: '已傳送', bad_leader: '隊長帳號不對', leader_offline: '隊長不在線上',
  joined: '已加入隊伍', left: '已離隊', added: '已新增', deleted: '已刪除',
  bad_account: '帳號／密碼只能英數字底線（最多 16 字）', bad_charname: '角色名只能英數字底線（最多 16 字）',
  no_char: '這個位置沒有角色', create_failed: '建角色失敗（名字重複？）', enter_failed: '進入遊戲失敗',
  server_closed: '伺服器關閉連線', socket_error: '連線錯誤', timeout: '登入逾時，停在',
  autopoints_on: '自動配點開', autopoints_off: '自動配點關（可手動配點）', autopoints: '自動配點開著，先關掉才能手動配',
  point_added: '已配點', no_points: '點數不夠', pet_state: '已切換寵物狀態', unequipped: '已卸下', equipped: '已裝備',
  equip_failed: '裝不上（這件不能裝或沒有合適的欄位）', bag_full: '背包滿了', discarded: '已丟棄',
};
const text = code => { const [k, arg] = String(code ?? '').split(':'); return (MSG[k] || k) + (arg ? ' ' + arg : ''); };
// 角色名是遊戲端（台版）送的 Big5 原始位元組，伺服器回 hex
const big5 = new TextDecoder('big5');
const name = h => big5.decode(new Uint8Array((h || '').match(/../g)?.map(x => parseInt(x, 16)) || []));
let bots = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

async function post(api, body) {
  try {
    const res = await fetch('/api/' + api, { method: 'POST', body: JSON.stringify(body) });
    const r = await res.json();
    toast((r.ok ? '✓ ' : '✗ ') + text(r.msg));
  } catch (e) {
    toast('✗ 連不到伺服器');
  }
  refresh();
}

function act(account, action, extra) {
  post('botact', Object.assign({ account, action }, extra || {}));
}

function bar(v, max, color) {
  const pct = max > 0 ? Math.round(v / max * 100) : 0;
  return `<div class="bar"><div style="width:${pct}%;background:var(${color})"></div></div>`;
}

function row(b) {
  const c = b.char;
  const online = b.state === 'online';
  const a = esc(b.account);
  const leaders = bots.filter(x => x.state === 'online' && x.account !== b.account)
    .map(x => `<option value="${esc(x.account)}">${esc(x.char ? name(x.char.nameHex) : x.account)}</option>`).join('');
  const buttons = [];
  if (online) {
    buttons.push(`<button data-a="${a}" data-act="logout">登出</button>`);
    buttons.push(`<button class="${c.auto ? 'on' : ''}" data-a="${a}" data-act="auto" data-on="${!c.auto}">自動戰鬥</button>`);
    buttons.push(`<button class="${b.activity === 'grind' ? 'on' : ''}" data-a="${a}" data-act="grind" data-on="${b.activity !== 'grind'}">原地練等</button>`);
    buttons.push(`<button data-a="${a}" data-act="encount">遇敵一次</button>`);
    buttons.push(`<button data-a="${a}" data-act="hospital">回東醫</button>`);
    buttons.push(`<button data-a="${a}" data-act="warp">傳送…</button>`);
    if (c.leaderHex) buttons.push(`<button data-a="${a}" data-act="leave">離隊</button>`);
    else if (leaders) buttons.push(`<select data-a="${a}" data-act="join"><option value="">加入隊伍…</option>${leaders}</select>`);
  } else {
    buttons.push(`<button class="primary" data-a="${a}" data-act="login">登入</button>`);
  }
  buttons.push(`<button class="${b.autologin ? 'on' : ''}" data-a="${a}" data-act="autologin" data-on="${!b.autologin}" title="伺服器啟動時自動登入">開機登入</button>`);
  buttons.push(`<button class="danger" data-a="${a}" data-del="1">刪除</button>`);

  const tags = [];
  if (c) {
    if (c.battle) tags.push('戰鬥中');
    if (c.leaderHex) tags.push(c.isLeader ? '隊長' : '隊員（' + name(c.leaderHex) + '）');
  }
  return `<tr>
    <td><strong>${a}</strong><div class="num">位置 ${b.slot}${b.charname ? '・' + esc(b.charname) : ''}</div></td>
    <td><span class="state ${esc(b.state)}">${STATE[b.state] || esc(b.state)}</span>${b.err ? `<div class="err">${esc(text(b.err))}</div>` : ''}</td>
    <td>${c ? `${img(c.face, 'face')}<span class="who" data-detail="${a}">${esc(name(c.nameHex))}</span><div class="num">Lv ${c.lv}・${c.gold} G</div>` : '<span class="muted">—</span>'}</td>
    <td>${c ? `<div class="num">${c.hp}/${c.maxHp}</div>${bar(c.hp, c.maxHp, '--hp')}<div class="num">${c.mp}/${c.maxMp}</div>${bar(c.mp, c.maxMp, '--mp')}` : ''}</td>
    <td>${c ? `${esc(c.mapName)}<div class="num">${c.floor} (${c.x},${c.y})</div>` : ''}</td>
    <td class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</td>
    <td><div class="actions">${buttons.join('')}</div></td>
  </tr>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/bots');
    bots = await res.json();
  } catch (e) {
    document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="err">連不到伺服器（10086 埠）</td></tr>';
    return;
  }
  if (document.activeElement && document.activeElement.tagName === 'SELECT') return; // 選單打開時不重畫
  const online = bots.filter(b => b.state === 'online').length;
  const shown = view();
  document.getElementById('count').textContent = `${online} / ${bots.length} 在線` + (shown.length !== bots.length ? `・顯示 ${shown.length}` : '');
  document.getElementById('rows').innerHTML = bots.length
    ? (shown.length ? shown.map(row).join('') : '<tr><td colspan="7" class="muted">沒有符合條件的帳號。</td></tr>')
    : '<tr><td colspan="7" class="muted">還沒有帳號，從上面新增。</td></tr>';
}

document.getElementById('rows').addEventListener('click', e => {
  const who = e.target.closest('[data-detail]');
  if (who) { openDetail(who.dataset.detail); return; }
  const btn = e.target.closest('button');
  if (!btn) return;
  const a = btn.dataset.a;
  if (btn.dataset.del) {
    if (confirm(`刪除帳號 ${a} 的管理設定？（不會刪遊戲裡的角色）`)) post('botdel', { account: a });
    return;
  }
  const action = btn.dataset.act;
  if (action === 'warp') {
    const v = prompt('傳送到「地圖編號 x y」，例如法蘭城東門外：1000 281 88');
    if (!v) return;
    const [floor, x, y] = v.trim().split(/\s+/).map(Number);
    act(a, 'warp', { floor, x, y });
    return;
  }
  act(a, action, btn.dataset.on !== undefined ? { on: btn.dataset.on === 'true' } : undefined);
});

document.getElementById('rows').addEventListener('change', e => {
  const sel = e.target;
  if (sel.dataset.act === 'join' && sel.value) act(sel.dataset.a, 'join', { leader: sel.value });
});

document.getElementById('add').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  post('botadd', Object.fromEntries(f.entries()));
  e.target.reset();
});

// 角色詳細（點角色名）：能力、裝備、背包、寵物，開著時跟著每 2 秒更新
const EQUIP = ['頭', '身體', '左手', '右手', '腳', '飾品 1', '飾品 2', '水晶'];
let detailAccount = null;
const list = x => Array.isArray(x) ? x : Object.values(x || {});
const pct = v => v ? `${v > 0 ? '+' : ''}${v}` : '';

// 遊戲圖檔：tools/cg_graphic.py 解到 lua/www/img/<圖號>.png（遊戲素材只放本機）；沒有圖就不顯示
function img(id, cls, title) {
  return id > 0 ? `<img class="px ${cls || ''}" src="/img/${id}.png" alt="" ${title ? `title="${esc(title)}"` : ''} onerror="this.remove()">` : '';
}

// 篩選與排序（點表頭切換升降冪）
let sortKey = 'account', sortDir = 1;
const STATE_ORDER = { online: 0, enter: 1, list: 2, login: 3, connect: 4, failed: 5, closed: 6, offline: 7 };
const sortVal = {
  account: b => b.account,
  state: b => STATE_ORDER[b.state] ?? 9,
  lv: b => b.char ? b.char.lv : -1,
  hp: b => b.char && b.char.maxHp ? b.char.hp / b.char.maxHp : -1,
  map: b => b.char ? b.char.floor * 1e6 + b.char.x * 1e3 + b.char.y : -1,
};
function view() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const st = document.getElementById('fstate').value;
  const ac = document.getElementById('fact').value;
  return bots.filter(b => {
    const c = b.char;
    if (q && !(b.account.toLowerCase().includes(q) || (c && name(c.nameHex).toLowerCase().includes(q)))) return false;
    if (st === 'online' && b.state !== 'online') return false;
    if (st === 'offline' && b.state === 'online') return false;
    if (ac === 'grind' && b.activity !== 'grind') return false;
    if (ac === 'battle' && !(c && c.battle)) return false;
    if (ac === 'party' && !(c && c.leaderHex)) return false;
    if (ac === 'solo' && !(c && !c.leaderHex)) return false;
    return true;
  }).sort((x, y) => {
    const a = sortVal[sortKey](x), b = sortVal[sortKey](y);
    return (a < b ? -1 : a > b ? 1 : x.account.localeCompare(y.account)) * sortDir;
  });
}
function markSort() {
  document.querySelectorAll('th.sort').forEach(th => {
    th.classList.toggle('asc', th.dataset.sort === sortKey && sortDir === 1);
    th.classList.toggle('desc', th.dataset.sort === sortKey && sortDir === -1);
  });
}
document.querySelectorAll('th.sort').forEach(th => th.addEventListener('click', () => {
  sortDir = sortKey === th.dataset.sort ? -sortDir : 1;
  sortKey = th.dataset.sort;
  markSort();
  refresh();
}));
['q', 'fstate', 'fact'].forEach(id => document.getElementById(id).addEventListener('input', refresh));
markSort();

function kv(pairs) {
  return `<dl class="kv">${pairs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

// target：手動配點的對象（'' 人物、數字＝寵物欄）；manual＝自動配點關著
// pic：放在血魔條右邊（對齊下面「體力」那欄）的圖
function stats(u, target, manual, pic) {
  const can = manual && u.points > 0;
  const base = (label, key) => [label, `${u[key]}${can ? `<button class="plus" data-point="${key}" data-pet="${target}">+1</button>` : ''}`];
  const bars = `
    <div class="num">HP ${u.hp}/${u.maxHp}</div>${bar(u.hp, u.maxHp, '--hp')}
    <div class="num">MP ${u.mp}/${u.maxMp}</div>${bar(u.mp, u.maxMp, '--mp')}
    <div class="num">經驗 ${u.exp}/${u.nextExp}</div>${bar(u.exp, u.nextExp, '--ok')}`;
  return `
    ${pic ? `<div class="barsrow"><div>${bars}</div><div class="petpic">${pic}</div></div>` : bars}
    <div style="height:8px"></div>
    ${kv([['攻擊', u.atk], base('體力', 'vit'), ['防禦', u.def], base('力量', 'str'), ['敏捷', u.quick], base('強度', 'tgh'),
          ['精神', u.spi], base('速度', 'agi'), ['回復', u.rec], base('魔法', 'mag')])}
    <div style="height:6px"></div>
    ${kv([['必殺', u.crit], ['反擊', u.counter], ['命中', u.hit], ['閃躲', u.dodge]])}
    <div class="elem num" style="margin-top:6px"><span>地 ${u.earth / 10}</span><span>水 ${u.water / 10}</span><span>火 ${u.fire / 10}</span><span>風 ${u.wind / 10}</span></div>
    <div class="num">受傷 ${u.injury}・未配點數 ${u.points}</div>`;
}

function bagCell(it) {
  if (!it) return '<div class="slot empty"></div>';
  const n = esc(name(it.nameHex)) || '（無名稱）';
  return `<div class="slot has ${it.slot === bagSel ? 'sel' : ''}" data-bagsel="${it.slot}" title="${n}${it.n > 1 ? ' ×' + it.n : ''}">${img(it.img) || n}${it.n > 1 ? `<span class="cnt">${it.n}</span>` : ''}</div>`;
}

// 背包選取的道具（點格子選），下方顯示名稱與「裝備／丟棄」
let bagSel = null;
function bagBar(it) {
  if (!it) return '<div class="toolbar bagbar muted">點背包的道具可以裝備或丟棄</div>';
  return `<div class="toolbar bagbar"><strong>${esc(name(it.nameHex)) || '（無名稱）'}${it.n > 1 ? ' ×' + it.n : ''}</strong>
    <button data-equip="${it.slot}">裝備</button><button class="danger" data-discard="${it.slot}">丟棄</button></div>`;
}

function itemCell(it, label) {
  if (!it) return `<div class="slot empty">${label ? `<div class="lbl">${label}</div>` : ''}—</div>`;
  const mods = [['攻', it.atk], ['防', it.def], ['敏', it.quick], ['精', it.spi], ['回', it.rec]].filter(([, v]) => v).map(([k, v]) => k + pct(v)).join(' ');
  return `<div class="slot">${img(it.img)}<div>${label ? `<div class="lbl">${label}</div>` : ''}${esc(name(it.nameHex)) || '<span class="muted">（無名稱）</span>'}${it.n > 1 ? ` ×${it.n}` : ''}
    <div class="num">${it.maxDur > 0 ? `耐久 ${it.dur}/${it.maxDur}` : ''}${mods ? ' ' + mods : ''}</div></div>${label ? `<button class="mini" data-unequip="${it.slot}">卸下</button>` : ''}</div>`;
}

function detailAct(action, extra) {
  post('botact', Object.assign({ account: detailAccount, action }, extra)).then(loadDetail);
}

document.getElementById('dbody').addEventListener('click', e => {
  const sel = e.target.closest('[data-petsel]');
  if (sel) { petSel = Number(sel.dataset.petsel); loadDetail(); return; }
  const bag = e.target.closest('[data-bagsel]');
  if (bag) { const v = Number(bag.dataset.bagsel); bagSel = bagSel === v ? null : v; loadDetail(); return; }
  const drop = e.target.closest('[data-discard]');
  if (drop) {
    if (confirm('丟棄這個道具？（直接刪除，不會掉在地上）')) { bagSel = null; detailAct('discard', { slot: Number(drop.dataset.discard) }); }
    return;
  }
  const t = e.target.closest('[data-point],[data-unequip],[data-equip],[data-autopoints]');
  if (!t) return;
  const d = t.dataset;
  if (d.point) detailAct('addpoint', Object.assign({ stat: d.point, n: 1 }, d.pet !== '' ? { pet: Number(d.pet) } : {}));
  else if (d.unequip) detailAct('unequip', { slot: Number(d.unequip) });
  else if (d.equip) { bagSel = null; detailAct('equip', { slot: Number(d.equip) }); }
  else if (d.autopoints) detailAct('autopoints', { on: d.autopoints === 'true' });
});
document.getElementById('dbody').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.petstate !== undefined) detailAct('petstate', { slot: Number(t.dataset.petstate), state: Number(t.value) });
});

// 寵物：左邊列表（點選切換），右邊選中那隻的圖、狀態、能力、掉檔、技能；選哪隻記在 petSel（換角色時歸零）
const PET_STATE = { 2: '出戰', 1: '待命', 3: '休息' };
let petSel = 0;
function petPanel(pets, c) {
  const p = pets.find(x => x.slot === petSel) || pets[0];
  return `<div class="pets">
    <ul class="petlist">${pets.map(x => `<li class="${x.slot === p.slot ? 'sel' : ''}" data-petsel="${x.slot}">${img(x.img, 'thumb')}
      <div><strong>${esc(name(x.nameHex))}</strong><div class="num">Lv ${x.lv}・${PET_STATE[x.state] || '—'}</div></div></li>`).join('')}</ul>
    <div class="petinfo">
      <h3>${esc(name(p.nameHex))}　Lv ${p.lv}・忠誠 ${p.loyal}</h3>
      <div class="toolbar"><select data-petstate="${p.slot}">${[2, 1, 3].map(v => `<option value="${v}" ${p.state === v ? 'selected' : ''}>${PET_STATE[v]}</option>`).join('')}</select></div>
      ${stats(p, p.slot, !c.autoPoints, img(p.img))}
      <div class="num" style="margin-top:4px">掉檔：${list(p.drop).map((v, i) => `${['體', '力', '強', '敏', '魔'][i]} ${v}`).join('　')}（共 ${list(p.drop).reduce((a, b) => a + b, 0)}）</div>
      <div class="num" style="margin-top:4px">技能：${list(p.skills).map(h => esc(name(h))).join('、') || '—'}</div>
    </div></div>`;
}

function renderDetail(d) {
  if (document.activeElement && document.activeElement.tagName === 'SELECT' && document.getElementById('detail').contains(document.activeElement)) return;
  const c = d.char;
  const items = {};
  list(d.items).forEach(it => { items[it.slot] = it; });
  const pets = list(d.pets);
  document.getElementById('dtitle').textContent = `${name(c.nameHex)}　Lv ${c.lv}・${c.gold} G`;
  document.getElementById('dbody').innerHTML = `
    <div class="card"><h3>能力</h3><div class="portrait">${img(c.face)}${img(c.img, 'body')}</div>
      <div class="toolbar"><button class="${c.autoPoints ? 'on' : ''}" data-autopoints="${!c.autoPoints}">自動配點</button>
        <span class="muted">${c.autoPoints ? '人物攻敏、寵物純攻' : '手動：點 +1 配點'}</span></div>${stats(c, '', !c.autoPoints)}</div>
    <div class="card"><h3>裝備</h3><div class="slots equip">${EQUIP.map((l, i) => itemCell(items[i], l)).join('')}</div></div>
    <div class="card wide"><h3>背包</h3><div class="slots bag">${Array.from({ length: 20 }, (_, i) => bagCell(items[i + 8])).join('')}</div>${bagBar(items[bagSel])}</div>
    <div class="card wide"><h3>寵物（${pets.length}）</h3>${pets.length ? petPanel(pets, c) : '<span class="muted">沒有寵物</span>'}</div>`;
}

async function loadDetail() {
  if (!detailAccount) return;
  try {
    const res = await fetch('/api/botdetail', { method: 'POST', body: JSON.stringify({ account: detailAccount }) });
    const d = await res.json();
    if (d.ok) renderDetail(d);
    else document.getElementById('dbody').innerHTML = `<p class="err">${esc(text(d.msg))}</p>`;
  } catch (e) {
    document.getElementById('dbody').innerHTML = '<p class="err">連不到伺服器</p>';
  }
}

function openDetail(account) {
  detailAccount = account;
  petSel = 0;
  bagSel = null;
  document.getElementById('dtitle').textContent = account;
  document.getElementById('dbody').innerHTML = '<p class="muted">載入中…</p>';
  document.getElementById('detail').showModal();
  loadDetail();
}

document.getElementById('dclose').addEventListener('click', () => document.getElementById('detail').close());
document.getElementById('detail').addEventListener('close', () => { detailAccount = null; });

refresh();
setInterval(() => { refresh(); loadDetail(); }, 2000);
</script>
</body>
</html>
